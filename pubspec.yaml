name: learn_to_research
description: Open-source trivia game that teaches real-world research skills.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  supabase_flutter: ^2.5.0
  audioplayers: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/avatars/
    - assets/audio/
